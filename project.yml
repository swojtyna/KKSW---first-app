name: DeluluDetox

options:
  bundleIdPrefix: com.kksw
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  defaultConfig: Debug
  developmentLanguage: en
  schemePathPrefix: ""

schemes:
  DeluluDetox:
    build:
      targets:
        DeluluDetox: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - DeluluDetoxTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

settingGroups:
  shared-ios:
    base:
      SWIFT_VERSION: "6.2"
      MARKETING_VERSION: "1.0"
      CURRENT_PROJECT_VERSION: "1"

packages:
  swift-navigation:
    url: https://github.com/pointfreeco/swift-navigation
    from: "2.8.0"

targets:
  DeluluDetox:
    type: application
    platform: iOS
    sources:
      - path: DeluluDetox/Sources
    resources:
      - path: DeluluDetox/Resources
    info:
      path: DeluluDetox/Info.plist
      properties:
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations~iphone:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleURLTypes:
          - CFBundleURLName: com.kksw.DeluluDetox
            CFBundleURLSchemes:
              - deluludetox
    settings:
      groups: [shared-ios]
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        PRODUCT_BUNDLE_IDENTIFIER: com.kksw.DeluluDetox
        SWIFT_EMIT_LOC_STRINGS: true
    dependencies:
      - target: DeviceActivityMonitorExtension
        embed: true
      - target: ShieldConfigurationExtension
        embed: true
      - target: ShieldActionExtension
        embed: true
      - package: swift-navigation
        product: SwiftUINavigation
    entitlements:
      path: DeluluDetox/DeluluDetox.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.kksw.DeluluDetox
        com.apple.developer.family-controls: true

  DeviceActivityMonitorExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: Extensions/DeviceActivityMonitorExtension
      - path: DeluluDetox/Sources/Features/Session/Repository/Models/SessionPaths.swift
      - path: DeluluDetox/Sources/Features/Session/Repository/Models/SessionFinalizeMarker.swift
      - path: DeluluDetox/Sources/Features/Session/Repository/Models/SessionActivityNames.swift
      - path: DeluluDetox/Sources/Features/Scheduling/Common/Repository/Models/Schedule.swift
      - path: DeluluDetox/Sources/Features/Scheduling/Common/Repository/Models/ScheduleSegment.swift
      - path: DeluluDetox/Sources/Features/Scheduling/Common/Repository/Models/ScheduleActivityNames.swift
      - path: DeluluDetox/Sources/Features/Scheduling/Common/Repository/Models/SchedulePaths.swift
      - path: DeluluDetox/Sources/Features/Scheduling/Common/Repository/Models/ScheduleEventMarker.swift
      - path: DeluluDetox/Sources/Features/Scheduling/Common/Repository/Models/ManagedSettingsStoreNames.swift
    settings:
      groups: [shared-ios]
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kksw.DeluluDetox.DeviceActivityMonitorExtension
        GENERATE_INFOPLIST_FILE: true
    info:
      path: Extensions/DeviceActivityMonitorExtension/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivity.monitor-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).DeviceActivityMonitorExtension
    entitlements:
      path: Extensions/DeviceActivityMonitorExtension/DeviceActivityMonitorExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.kksw.DeluluDetox
        com.apple.developer.family-controls: true

  ShieldConfigurationExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: Extensions/ShieldConfigurationExtension
      - path: DeluluDetox/Sources/Features/Session/Repository/Models/SessionPaths.swift
      - path: DeluluDetox/Sources/Features/Shield/Builder/ActiveSessionEnvelope.swift
      - path: DeluluDetox/Sources/Features/Shield/Builder/ShieldConfigurationBuilder.swift
    settings:
      groups: [shared-ios]
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kksw.DeluluDetox.ShieldConfigurationExtension
        GENERATE_INFOPLIST_FILE: true
    info:
      path: Extensions/ShieldConfigurationExtension/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettingsUI.shield-configuration-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShieldConfigurationExtension
    entitlements:
      path: Extensions/ShieldConfigurationExtension/ShieldConfigurationExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.kksw.DeluluDetox
        com.apple.developer.family-controls: true

  ShieldActionExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: Extensions/ShieldActionExtension
      - path: DeluluDetox/Sources/Features/Session/Repository/Models/SessionPaths.swift
      - path: DeluluDetox/Sources/Features/Shield/Builder/ActiveSessionEnvelope.swift
      - path: DeluluDetox/Sources/Features/Shield/ActionHandler/ShieldActionHandler.swift
      - path: DeluluDetox/Sources/Features/Shield/Repository/ShieldNotificationRepository.swift
    settings:
      groups: [shared-ios]
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kksw.DeluluDetox.ShieldActionExtension
        GENERATE_INFOPLIST_FILE: true
    info:
      path: Extensions/ShieldActionExtension/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettings.shield-action-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShieldActionExtension
    entitlements:
      path: Extensions/ShieldActionExtension/ShieldActionExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.kksw.DeluluDetox
        com.apple.developer.family-controls: true

  DeluluDetoxTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: DeluluDetoxTests
    settings:
      groups: [shared-ios]
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kksw.DeluluDetox.Tests
        GENERATE_INFOPLIST_FILE: true
    dependencies:
      - target: DeluluDetox
